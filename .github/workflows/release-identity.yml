name: Release tag identity
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Fail on mismatched tag, version, source or tested release
        run: python3 -B tools/verify_release.py --require-tag
# Deliberately no GitHub Release creation, write permission or asset replacement.
